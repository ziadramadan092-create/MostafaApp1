name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK Build Tools & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lib32stdc++6 lib32z1
          npm install

      - name: Initialize Capacitor Android & Sync
        run: |
          npx cap init --name "Mostafa Vocab" --bundle-id com.hanzala.vocabapp --web-dir www --yes || true
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mostafa-Vocab-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
