name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04 # تثبيت الإصدار لتجنب مفاجآت التحديث التلقائي
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # ترقية Node إلى 22 (مستقر ومدعوم)
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5 # ترقية إلى v5 (الإصدار المدعوم)
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          npm install --loglevel=error # تقليل الضجيج وتجنب فشل العملية بسبب التحذيرات
          # إذا استمر فشل sharp، قد تحتاج لإضافة هذه الخطوة:
          # npm rebuild sharp

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate App Icons & Splash
        run: node resources/generate-icons.js

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mostafa-Vocab-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
