<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0d4ff"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- الكتاب في الوسط -->
  <g filter="url(#shadow)" transform="translate(0, -30)">
    <path d="M 512 370 Q 395 332 305 370 L 305 700 Q 395 662 512 700 Z" fill="url(#bookGrad)" stroke="#ffffff" stroke-width="10"/>
    <path d="M 512 370 Q 629 332 719 370 L 719 700 Q 629 662 512 700 Z" fill="url(#bookGrad)" stroke="#ffffff" stroke-width="10"/>
    <line x1="512" y1="370" x2="512" y2="700" stroke="#ffffff" stroke-width="12"/>
  </g>

  <text x="410" y="565" font-family="Arial Black, sans-serif" font-size="180" font-weight="900" fill="#4A00E0" text-anchor="middle">A</text>
  <text x="618" y="585" font-family="Tahoma, Arial, sans-serif" font-size="200" font-weight="900" fill="#8E2DE2" text-anchor="middle">أ</text>

  <!-- موجة صوتية -->
  <g transform="translate(512, 775)" fill="#00d2ff">
    <rect x="-65" y="-20" width="12" height="40" rx="6"/>
    <rect x="-42" y="-34" width="12" height="68" rx="6"/>
    <rect x="-18" y="-48" width="12" height="96" rx="6"/>
    <rect x="6" y="-34" width="12" height="68" rx="6"/>
    <rect x="30" y="-20" width="12" height="40" rx="6"/>
    <rect x="54" y="-10" width="12" height="20" rx="6"/>
  </g>
</svg>
