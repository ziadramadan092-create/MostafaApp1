name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor & Project Dependencies
        run: |
          npm install -g @capacitor/cli @capacitor/core
          npm install

      - name: Create Android Platform and Sync
        run: |
          npx @capacitor/cli init "Mostafa Vocab" com.hanzala.vocabapp --web-dir www --yes || true
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mostafa-Vocab-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
